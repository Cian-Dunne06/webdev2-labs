<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Lab Two Exercise Two</title>
</head>

<body>
    <h1>For Loop</h1>
    <p>Look in the console for output</p>
    <script>
        let total = 0
        let count = 0
        for (let i = 2; i <= 20; i = i + 2) {
            console.log(i);
            total = total + i;
            count = count + 1;
        }

        console.log(`The average of the numbers is: ${total / count}`);



    </script>
</body>

</html>
