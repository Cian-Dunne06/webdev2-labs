<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Lab Two Exercise One</title>
</head>

<body>
    <h1>Switch Statement</h2>
        <p>Look in the console for output</p>
        <script>
            let colour = prompt("What colour is the traffic light?", "");

            switch (colour) {
                case 'green':
                    console.log("Go!");
                    break;
                case 'yellow':
                    console.log("Slow Down")
                    break;
                case 'red':
                    console.log("Stop");
                    break;
                default:
                    console.log("That isn't on a traffic light! (Try lower case!)");
            }

        </script>
</body>

</html>
