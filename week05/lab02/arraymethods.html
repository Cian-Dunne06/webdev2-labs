<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
<title>Array Methods</title>
</head>
<body>
<h1>Array Methods</h1>
<p id = "list1"></p>
<p id = "list2"></p>
<p id = "list3"></p>
<p id = "list4"></p>
<script>
const numbers = [12, 5, 8, 130, 44, 2, 19];
document.querySelector('#list1').textContent =  `Array elements: ${numbers.join(", ")}`;

const checkNumbers = (number) => number > 10;
const greaterThan = numbers.filter(checkNumbers);
document.querySelector('#list2').textContent =  `Numbers > 10: ${greaterThan.join(", ")}`;

const double = (number) => number * 2;
const doubledNum = numbers.map(double);
document.querySelector('#list3').textContent =  `Numbers doubled: ${doubledNum.join(", ")}`;

const sorted = numbers.sort((a,b) => a > b ? 1:-1);
document.querySelector('#list4').textContent =  `Numbers sorted: ${sorted.join(", ")}`;

</script>
</body>
</html>
